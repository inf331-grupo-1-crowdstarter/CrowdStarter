<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CrowdStarter</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar bg-light p-3"><a class="navbar-brand" href="{% url 'home' %}">CrowdStarter</a><div>{% if user.is_authenticated %}<a href="{% url 'logout' %}">Cerrar sesión</a>{% else %}<a href="{% url 'login' %}">Iniciar sesión</a> · <a href="{% url 'register' %}">Registrarse</a>{% endif %}</div></nav><main class="container py-4">{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
