{% extends "base.html" %}

{% block title %}Registro | CrowdStarter{% endblock %}

{% block content %}
<section class="card auth-card p-4">
    <h1 class="section-title">Crear cuenta</h1>
    <p class="text-muted">Únete a la comunidad que impulsa nuevas ideas.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary w-100" type="submit">Registrarse</button>
    </form>
</section>
{% endblock %}
