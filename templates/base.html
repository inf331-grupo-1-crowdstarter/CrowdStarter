<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CrowdStarter · Ideas que avanzan{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg p-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">CrowdStarter</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <a class="nav-link" href="{% url 'campaign_list' %}">Explorar campañas</a>
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'creator_panel' %}">Panel de campañas</a>
                        <a class="nav-link" href="{% url 'campaign_create' %}">Crear campaña</a>
                        <a class="nav-link" href="{% url 'user_history_contributions' %}">Mis aportes</a>
                        <a class="btn btn-light btn-sm" href="{% url 'logout' %}">Cerrar sesión</a>
                    {% else %}
                        <a class="nav-link" href="{% url 'login' %}">Iniciar sesión</a>
                        <a class="btn btn-light btn-sm" href="{% url 'register' %}">Registrarse</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <main class="container page-shell py-4">
        {% for message in messages %}
            <div class="alert alert-success shadow-sm">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
