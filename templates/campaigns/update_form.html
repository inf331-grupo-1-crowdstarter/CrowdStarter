{% extends "base.html" %}
{% block content %}
<h1>{{ heading }}</h1>
<p class="text-muted">Campaña: {{ campaign.title }}</p>
<form method="post" class="card p-3 mb-3">
  {% csrf_token %}
  {{ form.as_p }}
  <div>
    <button class="btn btn-primary">Guardar actualización</button>
    <a class="btn btn-secondary" href="{{ campaign.get_absolute_url }}#actualizaciones">Cancelar</a>
  </div>
</form>
{% endblock %}
