{% extends "base.html" %}

{% block title %}Iniciar sesión | CrowdStarter{% endblock %}

{% block content %}
<section class="card auth-card p-4">
<h1 class="section-title">Iniciar sesión</h1>
<p class="text-muted">Accede para apoyar proyectos y gestionar tus campañas.</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
</form>

<p>
    ¿No tienes cuenta?
    <a href="{% url 'register' %}">Registrarse</a>
</p>
</section>
{% endblock %}
