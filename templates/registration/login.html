<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | CrowdStarter</title>
</head>

<body>
    <h1>Iniciar sesión</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit">Iniciar sesión</button>
    </form>

    <p>
        ¿No tienes cuenta?
        <a href="{% url 'register' %}">Registrarse</a>
    </p>
</body>
</html>
