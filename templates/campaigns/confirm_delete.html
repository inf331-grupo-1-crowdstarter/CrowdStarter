{% extends "base.html" %}{% block content %}<h1>Eliminar campaña</h1><p>¿Confirmas eliminar «{{ campaign.title }}»?</p>{% if campaign.contributions.exists %}<div class="alert alert-warning">No puedes eliminar una campaña con aportes.</div>{% else %}<form method="post">{% csrf_token %}<button class="btn btn-danger">Confirmar eliminación</button></form>{% endif %}<a href="{{ campaign.get_absolute_url }}">Cancelar</a>{% endblock %}
